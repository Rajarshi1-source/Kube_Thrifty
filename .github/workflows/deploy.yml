name: Deploy

# Builds, signs and deploys. Two properties this workflow guarantees:
#
#   1. Images are tagged by COMMIT SHA, never `latest`. A floating tag makes "what is running?"
#      unanswerable, and makes a rollback a guess.
#   2. Every image is signed with cosign KEYLESS signing, so the provenance is verifiable without
#      anyone managing a private key.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  # NOT cancel-in-progress. Cancelling a deploy mid-`helm upgrade` can leave a release in a
  # pending-upgrade state that requires manual `helm rollback` to clear.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Required for cosign keyless signing: it exchanges this token for a Fulcio certificate, which
      # is what removes the need to manage a signing key at all.
      id-token: write
    strategy:
      matrix:
        include:
          - name: analyser
            dockerfile: analyser/Dockerfile
            context: .
          - name: dashboard
            dockerfile: dashboard/Dockerfile
            context: ./dashboard
          - name: cgroup-collector
            dockerfile: collector/Dockerfile
            context: .
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An OCI repository name must be lowercase. `github.repository_owner` is not normalised, so an
      # owner with any uppercase character (e.g. `Rajarshi1-source`) produces an invalid tag and
      # `docker/build-push-action` fails before it builds anything.
      - name: Compute a lowercase image owner
        id: image_owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # SHA tags only, plus a semver tag on a release. No `latest`, ever -- the CI grep guard in
          # policy.yml fails the build if one appears.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_owner.outputs.value }}/${{ matrix.name }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/{1}/{2}:{3}', env.REGISTRY, steps.image_owner.outputs.value, matrix.name, github.ref_name) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # SBOM and provenance attestations, so what is inside each image is auditable later.
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        # Signing the DIGEST, not the tag. A tag can be repointed; a digest cannot, so a
        # digest-scoped signature is the only one that means anything.
        run: |
          cosign sign --yes \
            "${REGISTRY}/${{ steps.image_owner.outputs.value }}/${{ matrix.name }}@${DIGEST}"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # A real deployment needs an approval gate. GitHub environments provide it, and it is the only
    # thing standing between a green test suite and production.
    environment: ${{ inputs.environment || 'staging' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: "4.2.4"

      # `jobs.<job_id>.if` cannot see `secrets` (only github/needs/vars/inputs), so the job itself
      # can't be skipped based on whether KUBECONFIG exists. Guarding each cluster-touching step
      # instead: no real cluster is wired up yet, and a missing secret is a missing prerequisite,
      # not a broken deploy. This flips to running the moment KUBECONFIG is added under repo
      # Settings -> Secrets and variables -> Actions.
      - name: Check for a deploy target
        id: has_target
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "no KUBECONFIG secret configured; skipping the remaining deploy steps"
          fi
          echo "configured=${KUBECONFIG_B64:+true}" >> "$GITHUB_OUTPUT"

      - name: Configure kubeconfig
        if: steps.has_target.outputs.configured == 'true'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: helm upgrade --install
        if: steps.has_target.outputs.configured == 'true'
        run: |
          helm upgrade --install kubethrifty charts/kubethrifty \
            --namespace kubethrifty --create-namespace \
            --set analyser.image.tag=${{ github.sha }} \
            --set dashboard.image.tag=${{ github.sha }} \
            --set cgroupCollector.image.tag=${{ github.sha }} \
            --wait --timeout 10m \
            --atomic

      # Helm 4 uses kstatus for `--wait`, which WATCHES resources rather than polling them. That
      # needs the `watch` verb on everything the chart manages -- a migration step that silently
      # breaks `--wait` on a Helm 3 role.
      - name: Verify rollout
        if: steps.has_target.outputs.configured == 'true'
        run: |
          kubectl -n kubethrifty rollout status deploy/kubethrifty-dashboard --timeout=5m
          kubectl -n kubethrifty rollout status daemonset/kubethrifty-cgroup-collector --timeout=5m
          # The analyser is NOT checked: it runs at minReplicaCount 0 behind KEDA, so zero replicas
          # is its healthy steady state and `rollout status` would hang waiting for one.

      - name: Verify the collector is not blind
        if: steps.has_target.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # A collector that runs but reads nothing degrades every memory recommendation to
          # `partial`. Catching that here beats discovering it in a recommendation weeks later.
          kubectl -n kubethrifty wait --for=condition=Ready pod \
            -l app.kubernetes.io/component=cgroup-collector --timeout=2m
          pod="$(kubectl -n kubethrifty get pod -l app.kubernetes.io/component=cgroup-collector \
            -o jsonpath='{.items[0].metadata.name}')"
          targets="$(kubectl -n kubethrifty exec "$pod" -- \
            python -c "import urllib.request;d=urllib.request.urlopen('http://localhost:9847/metrics').read().decode();print([l.split()[1] for l in d.splitlines() if l.startswith('kubethrifty_cgroup_scrape_targets ')][0])")"
          echo "collector discovered $targets cgroup(s)"
          if [ "${targets%%.*}" -eq 0 ]; then
            echo "FAIL: the collector found no container cgroups"
            exit 1
          fi
