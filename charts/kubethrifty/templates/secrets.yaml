{{- if .Values.timescaledb.enabled }}
# ================================================================================================
# Database credentials.
#
# The password is GENERATED on first install and then PRESERVED across upgrades. That second half is
# the part people get wrong: a plain `randAlphaNum` regenerates on every `helm upgrade`, which
# rotates the password out from under a running Postgres whose data directory still has the old one.
# The symptom is every client failing authentication after a routine upgrade.
#
# `lookup` reads the existing Secret from the cluster and reuses its value. `lookup` returns an empty
# map during `helm template` and `--dry-run` (there is no cluster to read), so the fallback also
# keeps those working.
#
# For anything beyond a demo, point `github.existingSecret` at an externally managed Secret and take
# this out of Helm's hands entirely -- ideally via External Secrets or Sealed Secrets, so a password
# never exists in Helm release state at all.
# ================================================================================================
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-db" (include "kubethrifty.fullname" .)) }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubethrifty.fullname" . }}-db
  labels:
    {{- include "kubethrifty.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall`, so the volume's data stays reachable if the release is reinstalled.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $password | quote }}
  # `postgresql+psycopg://` explicitly: SQLAlchemy resolves a bare `postgresql://` to the psycopg2
  # dialect, which this project does not install. The failure is a misleading
  # "No module named 'psycopg2'" AND a silent degradation -- the analyser logs a warning and
  # continues without persistence, computing recommendations and storing none of them.
  url: >-
    postgresql+psycopg://kubethrifty:{{ $password }}@{{ include "kubethrifty.fullname" . }}-timescaledb:5432/kubethrifty
  # The dashboard's URL. Plain `postgresql://` because `pg` (node) expects that scheme.
  url_readonly: >-
    postgresql://kubethrifty:{{ $password }}@{{ include "kubethrifty.fullname" . }}-timescaledb:5432/kubethrifty
{{- end }}
